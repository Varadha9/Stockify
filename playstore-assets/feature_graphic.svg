<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A1D35"/>
      <stop offset="0.5" stop-color="#3D2E8C"/>
      <stop offset="1" stop-color="#6C63FF"/>
    </linearGradient>
    <radialGradient id="glow1" cx="200" cy="250" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6C63FF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#6C63FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="824" cy="250" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00C896" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#00C896" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg)"/>
  <circle cx="200" cy="250" r="220" fill="url(#glow1)"/>
  <circle cx="824" cy="250" r="200" fill="url(#glow2)"/>

  <!-- Icon (scaled ~3x, centered left) -->
  <g transform="translate(130, 110) scale(2.6)">
    <!-- Box body -->
    <path fill="#FFFFFF" d="M28,52 L28,82 Q28,85 31,85 L77,85 Q80,85 80,82 L80,52 Z"/>
    <!-- Box roof -->
    <path fill="#FFFFFF" d="M22,52 L54,36 L86,52 L80,52 L54,42 L28,52 Z"/>
    <!-- Roof highlight -->
    <path fill="#FFFFFF" fill-opacity="0.2" d="M54,36 L86,52 L80,52 L54,42 Z"/>
    <!-- Center divider -->
    <line x1="54" y1="52" x2="54" y2="85" stroke="#1A1D35" stroke-width="2.5"/>
    <!-- Shelf lines -->
    <line x1="28" y1="65" x2="80" y2="65" stroke="#1A1D35" stroke-width="2"/>
    <line x1="28" y1="75" x2="80" y2="75" stroke="#1A1D35" stroke-width="2"/>
    <!-- Shelf items -->
    <rect x="32" y="57" width="18" height="7" fill="#A89CFF"/>
    <rect x="58" y="57" width="18" height="7" fill="#A89CFF"/>
    <rect x="32" y="67" width="12" height="7" fill="#7B72CC"/>
    <rect x="64" y="67" width="12" height="7" fill="#7B72CC"/>
    <!-- Trend line -->
    <polyline points="62,32 70,24 78,28 86,18" fill="none" stroke="#00C896" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arrow head -->
    <polygon points="83,15 89,15 89,21" fill="#00C896"/>
    <!-- Trend dots -->
    <circle cx="62" cy="32" r="3" fill="#00C896"/>
    <circle cx="70" cy="24" r="3" fill="#00C896"/>
    <circle cx="78" cy="28" r="3" fill="#00C896"/>
  </g>

  <!-- App name -->
  <text x="530" y="210" font-family="sans-serif" font-weight="bold" font-size="88" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">Stockify</text>

  <!-- Tagline -->
  <text x="530" y="275" font-family="sans-serif" font-size="32" fill="#A89CFF" text-anchor="middle" letter-spacing="1">Inventory made simple</text>

  <!-- Feature pills -->
  <rect x="330" y="320" width="160" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.1"/>
  <text x="410" y="348" font-family="sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">📦 Track Stock</text>

  <rect x="510" y="320" width="160" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.1"/>
  <text x="590" y="348" font-family="sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">📷 Scan Barcodes</text>

  <rect x="690" y="320" width="170" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.1"/>
  <text x="775" y="348" font-family="sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">🔔 Low Stock Alerts</text>

  <!-- Bottom label -->
  <text x="530" y="440" font-family="sans-serif" font-size="22" fill="#6C63FF" fill-opacity="0.7" text-anchor="middle">Offline · Free · No subscription</text>
</svg>
